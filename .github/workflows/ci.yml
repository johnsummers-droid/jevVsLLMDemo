# CI (plan1.txt section 5 and T16): server tests on the deployment Python, the same suite against
# PostgreSQL, Alembic migrations, web lint/build/tests, and the schema/fixture drift check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  server:
    name: Server (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Alembic upgrade on an empty SQLite database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db

  server-postgres:
    name: Server (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Alembic upgrade on PostgreSQL
        run: |
          python -c "from sqlalchemy import create_engine, text
          with create_engine('$TEST_DATABASE_URL').begin() as c:
              c.execute(text('DROP SCHEMA public CASCADE')); c.execute(text('CREATE SCHEMA public'))"
          alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  drift:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e '.[dev]'
        working-directory: server
      - run: npm ci
        working-directory: web
      - name: Regenerate schema, fixtures and TS types
        run: |
          (cd server && python scripts/export_schema.py && python scripts/export_web_fixtures.py \
            && python -m app.catalog.default_graph > ../shared/fixtures/graphs/default.json \
            && python -m app.simulation.reference_graphs)
          (cd web && npm run gen:types)
      - name: Fail if anything changed
        run: |
          git status --short
          git diff --exit-code shared/ web/src/types/generated.ts
