[project]
name = "pipeline-simulator-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.simulation" = ["packs/*.json"]
"app.tools" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
